[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-contextualizer"
version = "0.1.0"
description = "Turns Riot match + timeline JSON into a text brief for LLM judging."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rift_contextualizer*"]
